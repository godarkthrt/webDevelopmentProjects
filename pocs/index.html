<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POC CSS</title>
    <style>
/* Container using class selector */
.card-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 2rem;
  padding: 2rem;
}

/* Class selector for each card */
.card {
  border: 1px solid #ddd;
  padding: 1.5rem;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
  transition: transform 0.2s;
}

/* Hover effect using pseudo-class */
.card:hover {
  transform: translateY(-5px);
  
}

/* Descendant selector: target elements inside card */
.card img {
  max-width: 100%;
  border-radius: 5px;
  margin-bottom: 1rem;
}

.card h3 {
  margin-top: 0;
}

.card p {
  font-size: 0.9rem;
  color: #555;
}

/* Button styling */
.btn {
  display: inline-block;
  margin-top: 1rem;
  background-color: #007bff;
  color: white;
  padding: 0.5rem 1rem;
  text-decoration: none;
  border-radius: 4px;
}

/* Modifier class using multiple class selectors */
.card:hover {
  border-color: #007bff;
  background-color: #f0f8ff;
}

    </style>
</head>
<body>
<section class="card-container">
  <div class="card">
    <img src="image1.jpg" alt="Card 1 image">
    <h3>Card Title 1</h3>
    <p>This is a sample description for the card.</p>
    <a href="#" class="btn">Read More</a>
  </div>

  <div class="card featured">
    <img src="image2.jpg" alt="Card 2 image">
    <h3>Card Title 2</h3>
    <p>This is a featured card with more emphasis.</p>
    <a href="#" class="btn">Learn More</a>
  </div>
</section>

</body>
</html>
